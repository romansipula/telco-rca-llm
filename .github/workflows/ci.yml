name: ci
on:
  push:
  pull_request:
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]" "transformers==5.19.0" "peft==0.21.2" "accelerate==1.15.0"
      - name: Lint
        run: ruff check src tests
      - name: Tests (split leakage, evidence, schema, tiny CPU LoRA)
        run: pytest -q
